<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concept B: Alchemy Pixel Atlas — SynthesisFinder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf4e4;
      --surface: #fffdf7;
      --surface-2: #f1e6cf;
      --border: #5c4033;
      --text: #2b1d14;
      --muted: #6e5544;
      --accent: #b45309;
      --accent-ink: #fffdf7;
      --gold: #d97706;
    }
    [data-theme="dark"] {
      --bg: #120d1d;
      --surface: #1b142b;
      --surface-2: #281e3f;
      --border: #6d4aff;
      --text: #f3e8ff;
      --muted: #b7a3d9;
      --accent: #f59e0b;
      --accent-ink: #120d1d;
      --gold: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", sans-serif;
    }
    .px { font-family: "Silkscreen", monospace; }
    header {
      padding: 12px 24px;
      border-bottom: 3px solid var(--border);
      background: var(--surface);
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .btn {
      font-family: "Silkscreen", monospace; font-size: 0.76rem;
      padding: 8px 12px; border: 2px solid var(--border);
      background: var(--surface-2); color: var(--text);
      cursor: pointer; text-decoration: none; box-shadow: 3px 3px 0 var(--border);
    }
    .btn-gold { background: var(--accent); color: var(--accent-ink); }
    .layout {
      max-width: 1400px; margin: 20px auto; padding: 0 20px;
      display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 20px;
    }
    @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }
    .panel {
      border: 3px solid var(--border);
      box-shadow: 5px 5px 0 var(--border);
      background: var(--surface);
      padding: 16px;
    }
    .map-box { position: relative; }
    canvas { display: block; width: 100%; height: 480px; image-rendering: pixelated; cursor: pointer; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .chip {
      font-family: "Silkscreen", monospace; font-size: 0.7rem;
      padding: 5px 9px; border: 2px solid var(--border);
      background: var(--surface-2); cursor: pointer;
    }
    .chip.active { background: var(--accent); color: var(--accent-ink); }
    .quest-list { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
    .quest {
      border: 2px solid var(--border); background: var(--surface-2);
      padding: 12px; cursor: pointer;
    }
    .quest:hover { border-color: var(--accent); transform: translate(-1px, -1px); }
    .hearts { color: var(--gold); letter-spacing: 2px; font-size: 0.85rem; }
    .tooltip {
      position: absolute; pointer-events: none; display: none;
      border: 2px solid var(--border); background: var(--surface);
      padding: 8px 10px; box-shadow: 3px 3px 0 var(--border); z-index: 10;
    }
  </style>
</head>
<body>
  <header>
    <div class="px" style="font-size:0.95rem;">&#9878; ALCHEMY PIXEL ATLAS // CONCEPT B</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <a class="btn" href="index.html">All Concepts</a>
      <a class="btn" href="../index.html">Current Site</a>
      <button class="btn btn-gold" id="themeBtn">PARCHMENT / MIDNIGHT</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel map-box">
      <div class="px" style="font-size:0.85rem;margin-bottom:8px;">REACTION CONSTELLATION MAP (HOVER TO TWINKLE)</div>
      <canvas id="atlas"></canvas>
      <div class="tooltip" id="tip"></div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="px" style="font-size:0.88rem;" id="questHeader">SYNTHESIS QUEST LOG</div>
        <button class="btn" id="clearBtn">ALL</button>
      </div>
      <div class="quest-list" id="quests"></div>
    </section>
  </main>

  <script>
    const CLUSTERS = [
      { id: "aldol", name: "Aldol & Enolate", x: 0.25, y: 0.28, color: "#059669", dark: "#34d399", stars: ["Evans Aldol", "Mukaiyama", "Mannich", "Claisen"] },
      { id: "photo", name: "[2+2] & Photo", x: 0.72, y: 0.26, color: "#2563eb", dark: "#60a5fa", stars: ["Paterno-Buchi", "[2+2] Cycloadd", "Norrish II"] },
      { id: "coupling", name: "Cross-Coupling", x: 0.26, y: 0.72, color: "#be123c", dark: "#fb7185", stars: ["Suzuki-Miyaura", "Buchwald-Hartwig", "Stille", "Heck"] },
      { id: "peri", name: "Pericyclic", x: 0.72, y: 0.72, color: "#b45309", dark: "#fbbf24", stars: ["Diels-Alder", "Zincke", "Cope", "Nazarov"] }
    ];
    const QUESTS = [
      { target: "(-)-Strychnine", title: "Zincke Aldehyde Route (Vanderwal)", steps: 6, diff: 3, cluster: "peri", rxn: "Zincke" },
      { target: "(+)-Artemisinin", title: "Cook Concise Endoperoxide Synthesis", steps: 5, diff: 2, cluster: "photo", rxn: "[2+2] Cycloadd" },
      { target: "Bryostatin Fragment", title: "Mukaiyama Aldol Pyran Assembly", steps: 7, diff: 4, cluster: "aldol", rxn: "Mukaiyama" },
      { target: "Dragmacidin D", title: "Double Suzuki-Miyaura Coupling", steps: 9, diff: 4, cluster: "coupling", rxn: "Suzuki-Miyaura" }
    ];

    let selectedCluster = null, hovered = null, nodes = [], t = 0;
    const canvas = document.getElementById("atlas");
    const ctx = canvas.getContext("2d");
    const tip = document.getElementById("tip");
    const isDark = () => document.documentElement.getAttribute("data-theme") === "dark";

    function buildNodes() {
      canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
      nodes = [];
      CLUSTERS.forEach((c, i) => {
        const cx = Math.round(c.x * canvas.width), cy = Math.round(c.y * canvas.height);
        nodes.push({ kind: "hub", c, x: cx, y: cy, label: c.name });
        c.stars.forEach((s, j) => {
          const a = (j / c.stars.length) * Math.PI * 2 + i * 0.6;
          nodes.push({ kind: "star", c, x: Math.round(cx + Math.cos(a) * 62), y: Math.round(cy + Math.sin(a) * 56), label: s, ph: j });
        });
      });
    }

    function render() {
      t++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const dark = isDark();
      nodes.filter(n => n.kind === "star").forEach(n => {
        const hub = nodes.find(h => h.kind === "hub" && h.c.id === n.c.id);
        ctx.strokeStyle = dark ? "rgba(255,255,255,0.14)" : "rgba(43,29,20,0.16)";
        ctx.beginPath(); ctx.moveTo(hub.x, hub.y); ctx.lineTo(n.x, n.y); ctx.stroke();
      });
      nodes.forEach(n => {
        const col = dark ? n.c.dark : n.c.color;
        const hov = hovered === n;
        if (n.kind === "hub") {
          ctx.fillStyle = col;
          ctx.fillRect(n.x - 8, n.y - 8, 16, 16);
          ctx.font = "bold 10px Silkscreen, monospace";
          ctx.fillStyle = dark ? "#f3e8ff" : "#2b1d14";
          ctx.textAlign = "center";
          ctx.fillText(n.label, n.x, n.y + 24);
        } else {
          const s = hov ? 5 + Math.round(Math.sin(t * 0.4) * 2) : 3;
          ctx.fillStyle = col;
          ctx.fillRect(n.x - s, n.y - 1, s * 2 + 2, 2);
          ctx.fillRect(n.x - 1, n.y - s, 2, s * 2 + 2);
        }
      });
      requestAnimationFrame(render);
    }

    canvas.addEventListener("mousemove", e => {
      const r = canvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
      hovered = nodes.find(n => Math.hypot(n.x - mx, n.y - my) < 14) || null;
      if (hovered) {
        tip.style.display = "block";
        tip.style.left = Math.min(r.width - 190, hovered.x + 12) + "px";
        tip.style.top = Math.max(8, hovered.y - 16) + "px";
        tip.innerHTML = `<div class="px" style="font-size:0.68rem;color:var(--accent)">${hovered.c.name}</div><strong>${hovered.label}</strong>`;
      } else tip.style.display = "none";
    });
    canvas.addEventListener("click", () => { if (hovered) { selectedCluster = hovered.c.id; drawQuests(); } });

    function drawQuests() {
      const list = QUESTS.filter(q => !selectedCluster || q.cluster === selectedCluster);
      document.getElementById("quests").innerHTML = list.map(q => `
        <div class="quest" onclick="window.location.href='../index.html'">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <strong class="px" style="font-size:0.9rem;">${q.target}</strong>
            <span class="hearts">${"★".repeat(q.diff)}${"☆".repeat(5 - q.diff)}</span>
          </div>
          <div style="font-size:0.84rem;color:var(--muted);margin:4px 0;">${q.title}</div>
          <div class="px" style="font-size:0.68rem;">${q.rxn} · ${q.steps} STEPS</div>
        </div>
      `).join("");
      document.getElementById("legend").innerHTML = CLUSTERS.map(c =>
        `<button class="chip ${selectedCluster === c.id ? "active" : ""}" onclick="selectedCluster='${c.id}';drawQuests();">${c.name}</button>`
      ).join("");
    }

    document.getElementById("clearBtn").onclick = () => { selectedCluster = null; drawQuests(); };
    document.getElementById("themeBtn").onclick = () => {
      document.documentElement.setAttribute("data-theme", isDark() ? "light" : "dark");
    };
    window.addEventListener("resize", buildNodes);
    buildNodes(); drawQuests(); render();
  </script>
</body>
</html>
