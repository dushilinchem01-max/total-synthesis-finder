<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concept C: Cyber-Chem Terminal — SynthesisFinder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050b07;
      --surface: #0a140d;
      --border: #22c55e;
      --text: #bbf7d0;
      --muted: #4ade80;
      --accent: #facc15;
    }
    [data-theme="light"] {
      --bg: #f2f2ed;
      --surface: #ffffff;
      --border: #111827;
      --text: #111827;
      --muted: #4b5563;
      --accent: #1d4ed8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "VT323", monospace; font-size: 1.2rem;
    }
    .px { font-family: "Silkscreen", monospace; }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 16px 20px 60px; }
    .bar {
      border: 2px solid var(--border); background: var(--surface);
      padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
      margin-bottom: 16px;
    }
    .btn {
      font-family: "Silkscreen", monospace; font-size: 0.74rem;
      border: 2px solid var(--border); background: transparent; color: var(--text);
      padding: 6px 10px; cursor: pointer; text-decoration: none;
    }
    .btn:hover { background: var(--border); color: var(--bg); }
    .matrix-box {
      position: relative; border: 2px solid var(--border); background: var(--surface);
      margin-bottom: 16px;
    }
    canvas { display: block; width: 100%; height: 340px; image-rendering: pixelated; cursor: crosshair; }
    .cmd-row {
      display: flex; gap: 10px; margin-bottom: 14px;
    }
    .cmd-row input {
      flex: 1; padding: 8px 12px; border: 2px solid var(--border);
      background: var(--surface); color: var(--text); font-family: "VT323", monospace; font-size: 1.25rem;
    }
    .table { width: 100%; border-collapse: collapse; border: 2px solid var(--border); background: var(--surface); }
    .table th, .table td { border-bottom: 1px solid var(--border); padding: 10px 12px; text-align: left; }
    .table tr:hover td { background: rgba(34, 197, 94, 0.08); cursor: pointer; }
    .tip {
      position: absolute; display: none; pointer-events: none;
      border: 2px solid var(--accent); background: var(--surface); padding: 6px 10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <div class="px" style="font-size:0.88rem;">&gt;_ CYBER-CHEM TERMINAL // CONCEPT C</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <a class="btn" href="index.html">CONCEPTS</a>
        <a class="btn" href="../index.html">MAIN SITE</a>
        <button class="btn" id="themeBtn">CRT / RETRO-MAC</button>
      </div>
    </div>

    <div class="matrix-box">
      <canvas id="crt"></canvas>
      <div class="tip" id="tip"></div>
    </div>

    <div class="cmd-row">
      <input type="search" id="cmd" placeholder="> Filter by reaction or molecule (e.g. Aldol, Strychnine, [2+2])...">
      <button class="btn" id="allBtn">RESET</button>
    </div>

    <table class="table">
      <thead>
        <tr class="px" style="font-size:0.74rem;">
          <th>TARGET</th><th>REACTION CLUSTER</th><th>NAMED STEP</th><th>STEPS</th><th>JOURNAL</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script>
    const CLUSTERS = [
      { id: "Aldol", x: 0.16, y: 0.5, stars: ["Evans Aldol", "Mukaiyama", "Claisen"] },
      { id: "[2+2]", x: 0.38, y: 0.32, stars: ["Paterno-Buchi", "Enone [2+2]", "Norrish"] },
      { id: "Coupling", x: 0.62, y: 0.66, stars: ["Suzuki", "Buchwald", "Stille", "Heck"] },
      { id: "Pericyclic", x: 0.84, y: 0.44, stars: ["Diels-Alder", "Zincke", "Cope"] }
    ];
    const DATA = [
      { target: "(-)-Strychnine", cluster: "Pericyclic", rxn: "Zincke Ring-Opening", steps: 6, journal: "Chem. Sci. 2011" },
      { target: "(+)-Artemisinin", cluster: "[2+2]", rxn: "Enone [2+2] / Photo", steps: 5, journal: "JACS 2012" },
      { target: "Polyketide-04", cluster: "Aldol", rxn: "Evans Aldol", steps: 8, journal: "Org. Lett. 2024" },
      { target: "Indole Alkaloid", cluster: "Coupling", rxn: "Suzuki-Miyaura", steps: 7, journal: "ChemRxiv 2026" }
    ];

    let nodes = [], hov = null, t = 0;
    const canvas = document.getElementById("crt"), ctx = canvas.getContext("2d"), tip = document.getElementById("tip");
    const isLight = () => document.documentElement.getAttribute("data-theme") === "light";

    function init() {
      canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
      nodes = [];
      CLUSTERS.forEach((c, i) => {
        const cx = Math.round(c.x * canvas.width), cy = Math.round(c.y * canvas.height);
        nodes.push({ kind: "hub", c, x: cx, y: cy, label: c.id });
        c.stars.forEach((s, j) => {
          const a = (j / c.stars.length) * Math.PI * 2 + i;
          nodes.push({ kind: "star", c, x: Math.round(cx + Math.cos(a) * 52), y: Math.round(cy + Math.sin(a) * 48), label: s });
        });
      });
    }

    function loop() {
      t++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const colMain = isLight() ? "#111827" : "#22c55e";
      const colAcc = isLight() ? "#1d4ed8" : "#facc15";
      nodes.filter(n => n.kind === "star").forEach(n => {
        const h = nodes.find(x => x.kind === "hub" && x.c.id === n.c.id);
        ctx.strokeStyle = isLight() ? "rgba(17,24,39,0.2)" : "rgba(34,197,94,0.22)";
        ctx.beginPath(); ctx.moveTo(h.x, h.y); ctx.lineTo(n.x, n.y); ctx.stroke();
      });
      nodes.forEach(n => {
        if (n.kind === "hub") {
          ctx.fillStyle = colAcc; ctx.fillRect(n.x - 6, n.y - 6, 12, 12);
          ctx.font = "11px Silkscreen, monospace"; ctx.fillStyle = colMain; ctx.textAlign = "center";
          ctx.fillText(n.label, n.x, n.y + 20);
        } else {
          const tw = hov === n ? 5 + Math.round(Math.sin(t * 0.4) * 2) : 2;
          ctx.fillStyle = hov === n ? colAcc : colMain;
          ctx.fillRect(n.x - tw, n.y - 1, tw * 2 + 2, 2);
          ctx.fillRect(n.x - 1, n.y - tw, 2, tw * 2 + 2);
        }
      });
      requestAnimationFrame(loop);
    }

    canvas.addEventListener("mousemove", e => {
      const r = canvas.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
      hov = nodes.find(n => Math.hypot(n.x - mx, n.y - my) < 14) || null;
      if (hov) {
        tip.style.display = "block";
        tip.style.left = Math.min(r.width - 180, hov.x + 12) + "px";
        tip.style.top = Math.max(8, hov.y - 14) + "px";
        tip.innerHTML = `[${hov.c.id}] <b>${hov.label}</b>`;
      } else tip.style.display = "none";
    });
    canvas.addEventListener("click", () => { if (hov) { document.getElementById("cmd").value = hov.c.id; renderRows(); } });

    function renderRows() {
      const q = document.getElementById("cmd").value.trim().toLowerCase();
      const rows = DATA.filter(d => !q || `${d.target} ${d.cluster} ${d.rxn}`.toLowerCase().includes(q));
      document.getElementById("rows").innerHTML = rows.map(d => `
        <tr onclick="window.location.href='../index.html'">
          <td><strong>${d.target}</strong></td>
          <td>${d.cluster}</td>
          <td>${d.rxn}</td>
          <td>${d.steps}</td>
          <td>${d.journal}</td>
        </tr>
      `).join("");
    }

    document.getElementById("cmd").addEventListener("input", renderRows);
    document.getElementById("allBtn").onclick = () => { document.getElementById("cmd").value = ""; renderRows(); };
    document.getElementById("themeBtn").onclick = () => document.documentElement.setAttribute("data-theme", isLight() ? "dark" : "light");
    window.addEventListener("resize", init);
    init(); renderRows(); loop();
  </script>
</body>
</html>
