<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>threoglucin A — Total Synthesis Flashcard</title>
<style>
  :root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --border: #cbd5e1;
    --text: #0f172a;
    --muted: #475569;
    --accent: #1d4ed8;
    --accent-soft: #eff6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .title-block h1 {
    margin: 0;
    font-size: 1.1rem;
  }
  .title-block .meta {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  button, .btn-link {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    padding: 7px 13px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    text-decoration: none;
    font-weight: 500;
  }
  button:hover, .btn-link:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  main {
    max-width: 1480px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  .snake-board {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .snake-row-wrap {
    overflow-x: auto;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
  }
  .snake-row {
    display: flex;
    flex-wrap: nowrap;
    align-items: center;
    gap: 12px;
    min-width: max-content;
  }
  .snake-row.rtl {
    margin-left: auto;
  }
  .snake-turn {
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--accent);
    padding: 0 72px;
    line-height: 1;
  }
  .snake-turn.turn-right { text-align: right; }
  .snake-turn.turn-left { text-align: left; }
  .mol-card {
    flex: 0 0 auto;
    width: 240px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    padding: 10px;
    text-align: center;
    transition: box-shadow 0.15s;
  }
  .product-card {
    cursor: pointer;
  }
  .product-card:hover {
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
  }
  .mol-badge {
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    text-align: left;
  }
  .start-card .mol-badge {
    color: var(--accent);
  }
  .mol-visual {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 150px;
  }
  .mol-visual img,
  .mol-visual svg {
    display: block;
    max-width: 100%;
    max-height: 180px;
    width: auto;
    height: auto;
    object-fit: contain;
  }
  .step-arrow {
    flex: 0 0 auto;
    width: 190px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .reagent-box {
    background: var(--accent-soft);
    border: 1px solid #bfdbfe;
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
    width: 100%;
    font-size: 0.8rem;
  }
  .step-badge {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 2px;
  }
  .named-rxn {
    font-weight: 600;
    color: #1e3a8a;
    font-size: 0.75rem;
    margin-bottom: 2px;
  }
  .reagents-text {
    font-weight: 600;
    color: var(--text);
  }
  .cond-text {
    color: var(--muted);
    font-size: 0.74rem;
    margin-top: 2px;
  }
  .arrow-line {
    font-size: 1.5rem;
    color: var(--text);
    line-height: 1;
    margin-top: 4px;
  }
  .is-hidden .mol-visual,
  .is-hidden .named-rxn,
  .is-hidden .reagents-text,
  .is-hidden .cond-text {
    filter: blur(8px);
    opacity: 0.15;
    user-select: none;
  }
  .is-hidden::after {
    content: "Click to reveal";
    display: block;
    font-size: 0.72rem;
    color: var(--accent);
    font-weight: 600;
    margin-top: 4px;
  }
  @media print {
    header .controls { display: none; }
    .snake-row-wrap { overflow: visible; }
    .is-hidden .mol-visual,
    .is-hidden .named-rxn,
    .is-hidden .reagents-text,
    .is-hidden .cond-text {
      filter: none;
      opacity: 1;
    }
    .is-hidden::after { display: none; }
  }
</style>
</head>

<script>
  function toggleReveal(el) {
    el.classList.toggle('is-hidden');
  }
  function toggleGroup(cls, btn) {
    const active = btn.classList.toggle('active');
    document.querySelectorAll('.' + cls).forEach(el => {
      el.classList.toggle('is-hidden', active);
    });
  }
  function revealAll() {
    document.querySelectorAll('.is-hidden').forEach(el => el.classList.remove('is-hidden'));
    document.querySelectorAll('.controls button.active').forEach(b => b.classList.remove('active'));
  }
</script>
