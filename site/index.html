<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SynthesisFinder — Open-Access Total Synthesis Problems</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2.5 27.7 9.25v13.5L16 29.5 4.3 22.75V9.25Z' fill='none' stroke='%231d4ed8' stroke-width='2.6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#/" class="brand" id="brandHome">
        <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 2.5 27.7 9.25v13.5L16 29.5 4.3 22.75V9.25Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M16 8.5 22.5 12.25v7.5L16 23.5l-6.5-3.75v-7.5Z" fill="currentColor" opacity=".18"/>
        </svg>
        <div>
          <span class="brand-title">SynthesisFinder</span>
          <span class="brand-sub">Open-Access Total Synthesis Trainer</span>
        </div>
      </a>
      <div class="topbar-actions">
        <span class="updated-pill" id="updatedLabel">Loading catalog…</span>
        <button type="button" class="btn btn-ghost" id="themeToggle" title="Toggle theme">Theme</button>
      </div>
    </div>
  </header>

  <main class="container main-wrap">
    <!-- Catalog View -->
    <section id="catalogView">
      <div class="controls-bar">
        <div class="search-wrap">
          <input type="search" id="searchInput" placeholder="Search molecule, title, journal, or tag…" autocomplete="off">
        </div>
        <div class="filters-wrap">
          <select id="difficultyFilter" aria-label="Difficulty">
            <option value="">All difficulties</option>
            <option value="introductory">Introductory</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
          <select id="journalFilter" aria-label="Journal">
            <option value="">All journals</option>
          </select>
          <select id="progressFilter" aria-label="Progress">
            <option value="">All statuses</option>
            <option value="unsolved">Unsolved</option>
            <option value="solved">Solved</option>
            <option value="bookmarked">Bookmarked</option>
          </select>
        </div>
      </div>

      <div class="stats-row" id="statsRow"></div>
      <div class="catalog-grid" id="catalogGrid"></div>
      <div class="empty-state hidden" id="emptyState">
        No synthesis problems match your current filters.
      </div>
    </section>

    <!-- Problem Solver View -->
    <section id="problemView" class="hidden">
      <div class="problem-topbar">
        <button type="button" class="btn btn-ghost" id="backToCatalog">&#8592; All Problems</button>
        <div class="problem-links" id="problemLinks"></div>
      </div>

      <article class="problem-header-card" id="problemHeader"></article>

      <div class="solver-toolbar">
        <div class="toolbar-group">
          <button type="button" class="btn" id="btnHideReagents">Hide Reagents</button>
          <button type="button" class="btn" id="btnHideProducts">Hide Products</button>
          <button type="button" class="btn" id="btnStepByStep">Step-by-Step</button>
          <button type="button" class="btn" id="btnRevealAll">Reveal All</button>
        </div>
        <div class="toolbar-group">
          <button type="button" class="btn" id="btnBookmark">Bookmark</button>
          <button type="button" class="btn btn-primary" id="btnMarkSolved">Mark Solved</button>
          <a class="btn btn-outline hidden" id="btnSnakeHtml" target="_blank" rel="noopener">Open Snake Flashcard</a>
        </div>
      </div>

      <div class="snake-board" id="snakeBoard"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
