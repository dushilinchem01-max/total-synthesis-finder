<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SynthesisFinder — Total Synthesis Problem Bank</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#/" class="brand" id="brand-link">
        <span class="brand-icon" aria-hidden="true">⬡</span>
        <div>
          <span class="brand-title">SynthesisFinder</span>
          <span class="brand-subtitle">Automated Total Synthesis Problem Bank</span>
        </div>
      </a>
      <div class="topbar-actions">
        <div class="stats-pills" id="stats-pills" aria-label="Progress summary"></div>
        <button type="button" class="btn btn-ghost btn-sm" id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">
          <span id="theme-icon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container main-content">
    <!-- Catalog View -->
    <section id="catalog-view" class="view">
      <div class="controls-panel">
        <div class="search-row">
          <div class="search-box">
            <span class="search-icon" aria-hidden="true">🔍</span>
            <input
              type="search"
              id="search-input"
              placeholder="Search target molecule, title, authors, journal, DOI, or tags..."
              autocomplete="off"
            />
          </div>
          <select id="sort-select" aria-label="Sort problems">
            <option value="newest">Sort: Newest Added</option>
            <option value="year-desc">Sort: Year (Newest)</option>
            <option value="steps-asc">Sort: Steps (Fewest)</option>
            <option value="steps-desc">Sort: Steps (Most)</option>
          </select>
        </div>

        <div class="filters-row">
          <select id="filter-difficulty" aria-label="Filter by difficulty">
            <option value="all">All Difficulties</option>
            <option value="Introductory">Introductory</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>

          <select id="filter-journal" aria-label="Filter by journal">
            <option value="all">All Journals</option>
          </select>

          <select id="filter-year" aria-label="Filter by year">
            <option value="all">All Years</option>
          </select>

          <select id="filter-status" aria-label="Filter by progress">
            <option value="all">All Progress</option>
            <option value="unsolved">Unsolved</option>
            <option value="in_progress">In Progress</option>
            <option value="solved">Solved</option>
            <option value="bookmarked">Bookmarked ★</option>
          </select>

          <button type="button" class="btn btn-ghost btn-sm" id="reset-filters-btn">Reset</button>
        </div>
      </div>

      <div class="catalog-meta">
        <span id="results-count">Loading problems...</span>
        <span id="catalog-updated" class="muted"></span>
      </div>

      <div id="catalog-grid" class="catalog-grid"></div>
      <div id="catalog-empty" class="empty-state hidden">
        <p>No synthesis problems match your current filters.</p>
        <button type="button" class="btn btn-primary btn-sm" id="empty-reset-btn">Clear Filters</button>
      </div>
    </section>

    <!-- Solver View -->
    <section id="solver-view" class="view hidden">
      <div class="solver-nav">
        <button type="button" class="btn btn-ghost btn-sm" id="back-to-catalog">← Back to Catalog</button>
        <div class="solver-progress-controls">
          <div class="segmented-control" role="group" aria-label="Problem status">
            <button type="button" class="seg-btn" data-status="unsolved">Unsolved</button>
            <button type="button" class="seg-btn" data-status="in_progress">In Progress</button>
            <button type="button" class="seg-btn" data-status="solved">✓ Solved</button>
          </div>
          <button type="button" class="btn btn-outline btn-sm" id="solver-bookmark-btn" title="Bookmark problem">☆ Bookmark</button>
        </div>
      </div>

      <article class="problem-header card" id="problem-header"></article>

      <div class="study-toolbar card">
        <div class="study-toggles">
          <label class="toggle-chip">
            <input type="checkbox" id="toggle-hide-reagents" />
            <span>Hide Reagents</span>
          </label>
          <label class="toggle-chip">
            <input type="checkbox" id="toggle-hide-products" />
            <span>Hide Products</span>
          </label>
          <label class="toggle-chip">
            <input type="checkbox" id="toggle-step-mode" />
            <span>Reveal Step by Step</span>
          </label>
        </div>

        <div class="step-controls hidden" id="step-controls">
          <button type="button" class="btn btn-outline btn-sm" id="prev-step-btn">← Prev</button>
          <span class="step-counter" id="step-counter">Step 0 / 0</span>
          <button type="button" class="btn btn-primary btn-sm" id="next-step-btn">Next Step →</button>
          <button type="button" class="btn btn-ghost btn-sm" id="reveal-all-btn">Reveal All</button>
        </div>

        <div class="snake-actions" id="snake-actions"></div>
      </div>

      <div id="synthesis-sequence" class="synthesis-sequence"></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>SynthesisFinder • Open-Access Total Synthesis Flashcards</span>
      <span class="muted">Progress is saved locally in your browser (localStorage)</span>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
